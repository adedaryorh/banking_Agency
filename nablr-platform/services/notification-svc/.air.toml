root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"
env_files = [".env"]

[build]
  cmd = "go build -o ./tmp/notification-svc ./cmd"
  bin = "./tmp/notification-svc"
  include_ext = ["go", "mod", "sum", "html"]
  exclude_dir = ["tmp", "vendor", "testdata", "logs", ".git", ".idea", ".vscode"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  stop_on_error = true
  log = "tmp/build-errors.log"
  kill_delay = "500ms"
  send_interrupt = true
  poll = true
  poll_interval = 500

[color]
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = true
  main_only = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
